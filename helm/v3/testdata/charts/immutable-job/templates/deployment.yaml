apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-deploy
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: probe-deploy
  template:
    metadata:
      labels:
        app: probe-deploy
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
          {{- with .Values.deployEnv }}
          env:
            - name: PROBE
              value: {{ . | quote }}
          {{- end }}
