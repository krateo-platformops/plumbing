name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: unit + envtest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # ASSERT THE TOOLCHAIN PIN REACHED THIS RUNNER, rather than trusting two settings to agree.
      #
      # go.mod pins `toolchain go1.26.10`, and that pin is what govulncheck prices the standard
      # library against: with the pin, plumbing reports 25 called vulnerabilities; without it, 59,
      # because the toolchain then falls back to the `go` directive (#73).
      #
      # THE PIN REACHES A RUNNER BY TWO DIFFERENT ROUTES, and the dangerous combination is the
      # cross — found by the oasgen-provider session measuring their own CI rather than reading it:
      #
      #   setup-go  GOTOOLCHAIN  effective
      #   v6        local        1.26.10   v6 reads the toolchain line and installs it directly
      #   v5        auto         1.26.10   v5 installs the DIRECTIVE, then `go` self-downloads
      #   v5        local        1.26.0    WRONG STDLIB, SILENTLY -- or a hard failure
      #
      # This job is the first row. Each half looks fine in isolation, and the broken pair is reached
      # by changing EITHER one for an unrelated reason — bumping the action, or setting
      # GOTOOLCHAIN=local for determinism. So the right guard is not a comment telling the next
      # person which pair is safe; it is an assertion that the version actually in use matches the
      # pin, which holds whichever half changes.
      #
      # It FAILS when go.mod has no toolchain line, deliberately: a guard that passes over a missing
      # pin reports success for the exact state it exists to catch.
      - name: Assert the toolchain pin reached this runner
        run: |
          set -euo pipefail
          want=$(awk '/^toolchain /{print $2; exit}' go.mod)
          if [ -z "$want" ]; then
            echo "::error::go.mod declares no 'toolchain' line, so this guard has nothing to check and govulncheck would price the stdlib against the 'go' directive instead (plumbing#73). Restore the pin or delete this step deliberately."
            exit 1
          fi
          got=$(go env GOVERSION)
          echo "toolchain pin: $want"
          echo "go env GOVERSION: $got"
          echo "setup-go/GOTOOLCHAIN: $(go env GOTOOLCHAIN)"
          if [ "$want" != "$got" ]; then
            echo "::error::the toolchain pin $want did NOT reach this runner (GOVERSION=$got). Either setup-go stopped reading the toolchain line (v5 ignores it) or GOTOOLCHAIN=local blocked the self-download. CI is building and scanning a different standard library than the pin declares."
            exit 1
          fi
          echo "pin reached the runner"

      # Node runs the js/wasm tests: dialguard's TestPlumbingClientsKeepTheFetchPolicyOnJS drives them
      # through Node's real fetch and Go's in-process network. PLUMBING_REQUIRE_JS makes it FAIL
      # when Node is missing here, so the browser build's redirect guarantee can't pass by skipping.
      - name: Set up Node (js/wasm tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests (race)
        env:
          PLUMBING_REQUIRE_JS: "1"
        run: make test-race

      - name: Functional cache-staleness tests (envtest)
        run: make test-envtest

  integration:
    # The `integration` suite is the only end-to-end proof of the apply-if-changed no-churn
    # guarantees: the traceparent/tracestate neutralizations in Reconcile step 4.5, the Secret
    # stringData fold (4.6), adoption of live children missing from the stored manifest (4.7), and
    # the before/after semantic diff that gates whether a helm revision is written at all (step 6).
    #
    # Until now it had no runner. The tests existed, asserted the right things, and could not fail
    # a pull request — so the guarantee they describe was a claim rather than a gate, and an edit
    # deleting step 4.5 as redundant would have gone green while resuming the per-minute revision
    # churn the reconcile exists to kill. A suite nothing runs is not a safety net (#51, finding 1).
    #
    # A separate job rather than another step in `test`, so a kind-provisioning failure is
    # distinguishable at a glance from a unit or envtest failure and the fast suite still reports
    # in under a minute.
    name: integration (real cluster)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # ASSERT THE TOOLCHAIN PIN REACHED THIS RUNNER, rather than trusting two settings to agree.
      #
      # go.mod pins `toolchain go1.26.10`, and that pin is what govulncheck prices the standard
      # library against: with the pin, plumbing reports 25 called vulnerabilities; without it, 59,
      # because the toolchain then falls back to the `go` directive (#73).
      #
      # THE PIN REACHES A RUNNER BY TWO DIFFERENT ROUTES, and the dangerous combination is the
      # cross — found by the oasgen-provider session measuring their own CI rather than reading it:
      #
      #   setup-go  GOTOOLCHAIN  effective
      #   v6        local        1.26.10   v6 reads the toolchain line and installs it directly
      #   v5        auto         1.26.10   v5 installs the DIRECTIVE, then `go` self-downloads
      #   v5        local        1.26.0    WRONG STDLIB, SILENTLY -- or a hard failure
      #
      # This job is the first row. Each half looks fine in isolation, and the broken pair is reached
      # by changing EITHER one for an unrelated reason — bumping the action, or setting
      # GOTOOLCHAIN=local for determinism. So the right guard is not a comment telling the next
      # person which pair is safe; it is an assertion that the version actually in use matches the
      # pin, which holds whichever half changes.
      #
      # It FAILS when go.mod has no toolchain line, deliberately: a guard that passes over a missing
      # pin reports success for the exact state it exists to catch.
      - name: Assert the toolchain pin reached this runner
        run: |
          set -euo pipefail
          want=$(awk '/^toolchain /{print $2; exit}' go.mod)
          if [ -z "$want" ]; then
            echo "::error::go.mod declares no 'toolchain' line, so this guard has nothing to check and govulncheck would price the stdlib against the 'go' directive instead (plumbing#73). Restore the pin or delete this step deliberately."
            exit 1
          fi
          got=$(go env GOVERSION)
          echo "toolchain pin: $want"
          echo "go env GOVERSION: $got"
          echo "setup-go/GOTOOLCHAIN: $(go env GOTOOLCHAIN)"
          if [ "$want" != "$got" ]; then
            echo "::error::the toolchain pin $want did NOT reach this runner (GOVERSION=$got). Either setup-go stopped reading the toolchain line (v5 ignores it) or GOTOOLCHAIN=local blocked the self-download. CI is building and scanning a different standard library than the pin declares."
            exit 1
          fi
          echo "pin reached the runner"

      # No kind setup action here: each integration package creates and names its OWN cluster
      # through e2e-framework (envfuncs.CreateCluster + kind.NewProvider) — helm/v3 makes
      # "helm-test", endpoints makes "krateo" — and findOrInstallKind fetches the kind binary when
      # it is absent. Provisioning one here would add a third, unused cluster.
      #
      # Two clusters is the resource floor: neither package destroys its own at teardown, so both
      # are resident for the rest of the job. `make test-integration` passes -p 1 so they are built
      # one at a time rather than concurrently, which is what makes that fit at all — building both
      # at once failed outright on an 8-CPU machine. If this job ever fails with `failed to create
      # cluster`, it is capacity, not code, and the fix is a larger runner rather than a retry.
      - name: Integration tests (kind)
        run: make test-integration

  lint-docs:
    name: lint-docs
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main
